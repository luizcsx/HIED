name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar libnds, grit e ndstool
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm nds-dev

      - name: Compilar
        run: make

      - name: Guardar o ROM
        uses: actions/upload-artifact@v4
        with:
          name: hi-entrelinhas-nds
          path: hi-entrelinhas.nds

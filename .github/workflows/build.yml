name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar libnds, grit e ndstool (só se faltar)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            dkp-pacman -S --needed --noconfirm nds-dev && break
            echo "Tentativa $i falhou, aguardando..."; sleep 20
          done

      - name: Conferir ferramentas
        run: |
          which grit ndstool
          ls /opt/devkitpro/libnds /opt/devkitpro/calico

      - name: Guardar o ROM
        uses: actions/upload-artifact@v4
        with:
          name: rom-nds
          path: "*.nds"
          if-no-files-found: error

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Garantir libnds, grit e ndstool
        shell: bash
        run: |
          if command -v grit >/dev/null && command -v ndstool >/dev/null && [ -d /opt/devkitpro/libnds ]; then
            echo "Ferramentas já presentes na imagem."
          else
            for i in 1 2 3; do
              dkp-pacman -S --needed --noconfirm nds-dev && break
              echo "Tentativa $i falhou; aguardando 20 s..."
              sleep 20
            done
          fi
          if ! find /opt/devkitpro -type f \( -name "ds7*.elf" -o -name "default.elf" -o -name "*arm7*.elf" \) 2>/dev/null | grep -q .; then
            echo "ARM7 padrão não encontrado; tentando instalar default-arm7..."
            dkp-pacman -S --needed --noconfirm default-arm7 || true
          fi
          which grit ndstool
          ls /opt/devkitpro/libnds /opt/devkitpro/calico
          echo "--- specs e ARM7 disponíveis:"
          find /opt/devkitpro \( -name "*.specs" -o -name "ds7*.elf" -o -name "default.elf" \) 2>/dev/null || true

      - name: Compilar
        run: make

      - name: Gerar variantes com cada ARM7 (para achar o que suporta Maxmod)
        run: make variantes

      - name: Baixar e compilar o exemplo oficial de Maxmod (para comparar)
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git /tmp/nds-examples
          cd /tmp/nds-examples/audio/maxmod/basic_sound
          echo "--- Conteúdo do exemplo oficial ---"
          find . -maxdepth 2 -type f
          echo "--- Makefile do exemplo oficial ---"
          cat Makefile
          echo "--- Compilando exemplo oficial ---"
          make
          echo "--- Resultado ---"
          find . -name "*.nds"

      - name: Guardar o exemplo oficial compilado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exemplo-oficial-maxmod
          path: /tmp/nds-examples/audio/maxmod/basic_sound/**/*.nds
          if-no-files-found: warn

      - name: Inspecionar versoes instaladas (libnds, maxmod, calico, default-arm7)
        if: always()
        shell: bash
        run: |
          echo "--- Pacotes relacionados via pacman ---"
          dkp-pacman -Q | grep -iE "libnds|maxmod|calico|arm7|nds-dev|default" || echo "(nenhum encontrado via pacman -Q)"
          echo
          echo "--- Todos os pacotes instalados (lista completa) ---"
          dkp-pacman -Q || true
          echo
          echo "--- Conteudo de /opt/devkitpro/calico/lib ---"
          ls -la /opt/devkitpro/calico/lib 2>/dev/null || echo "(pasta nao existe)"
          echo
          echo "--- Conteudo de /opt/devkitpro/libnds/lib ---"
          ls -la /opt/devkitpro/libnds/lib 2>/dev/null || echo "(pasta nao existe)"
          echo
          echo "--- Simbolos relacionados a maxmod/mm dentro de libmm9.a ---"
          find /opt/devkitpro -iname "libmm9*" -exec sh -c 'echo "== {} =="; "$DEVKITARM/bin/arm-none-eabi-nm" {} 2>/dev/null | grep -i "mmInit\|mmEffect" | head -20' \; || true
          echo
          echo "--- Strings 'maxmod' ou 'mm_' dentro dos ARM7 do calico ---"
          for f in /opt/devkitpro/calico/bin/*.elf; do
            echo "== $f =="
            "$DEVKITARM/bin/arm-none-eabi-nm" "$f" 2>/dev/null | grep -i "mm_\|maxmod\|mmSound\|mmMix" | head -10 || echo "(sem simbolos relacionados a maxmod)"
          done
          echo
          echo "--- Buscando qualquer coisa chamada maxmod7 instalada ---"
          find /opt/devkitpro -iname "*maxmod7*" -o -iname "*mm7*" 2>/dev/null || true

      - name: Onde ficou o ROM?
        if: always()
        shell: bash
        run: |
          echo "Pasta atual: $(pwd)"
          ls -la
          echo "--- .nds e .elf encontrados:"
          find . -type f \( -name "*.nds" -o -name "*.elf" \) -not -path "./.git/*" || true
          echo "--- Tamanho do programa ARM9:"
          "$DEVKITARM/bin/arm-none-eabi-size" build/*.elf || true
          ls -la *.nds || true
          echo "--- TARGET e BUILD no Makefile:"
          grep -nE '^(TARGET|BUILD)\b' Makefile || true

      - name: Conferir que existe um ROM
        shell: bash
        run: |
          if ! find . -type f -name "*.nds" -not -path "./.git/*" | grep -q .; then
            echo "::error::O make terminou, mas nenhum .nds foi gerado. Veja o passo 'Onde ficou o ROM?' e o log do passo 'Compilar'."
            exit 1
          fi

      - name: Guardar o ROM
        uses: actions/upload-artifact@v4
        with:
          name: rom-nds
          path: "**/*.nds"
          if-no-files-found: error

      - name: Guardar as variantes (uma ROM por ARM7)
        uses: actions/upload-artifact@v4
        with:
          name: rom-variantes
          path: "build/variantes/*.nds"
          if-no-files-found: error
